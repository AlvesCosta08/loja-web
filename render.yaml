services:
  - type: web
    name: loja-web
    runtime: static
    plan: free
    region: oregon
    repo: https://github.com/AlvesCosta08/loja-web
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: dist          # 👈 Correção: sem a barra no início
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        value: https://loja-api-i53b.onrender.com   # 👈 Correção: URL real do backend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable